<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/script.css">
    <title>STUDENT_HUB</title>    
</head>

<body>
    <header>
        <h1>Student Hub Portal</h1> <hr>
    </header>

    <form action="../index.html">

    <label class="label" for="username">UserName</label><br>
    <input class="button" type="text" id="username" name="username" placeholder="Enter username here" required>

    <br><br>    

    <label class="label" for="pass">Set Password</label><br>
    <input class="button" type="password" id="pass" name="pass" placeholder="Enter password here" required>

    <br><br>

    <label class="label" for="pass">Re-enter Password</label><br>
    <input class="button" type="password" id="pass" name="pass" placeholder="Re-enter password here" required>

    <br><br> 

    <input type="submit" value="Submit" class="button">
    <input type="reset" value="Clear" class="button">

    </form>

    <form action="..\index.html">
        <br>
        <input type="submit" value="Back" class="button">
    </form>

    <footer>
        <h2>@2026 Student portal</h2>
    </footer>
    
</body>
</html>
